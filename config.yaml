# EARA Experiment Configuration
# 4 models via an OpenAI-compatible gateway: GPT / Qwen-Plus / Qwen3.5 / Kimi.
# 20 AppIds split into 4 groups of 5, one group per model (round-robin
# + 429 auto-rotation in llm.py). Enables per-model parallelism when run.py
# runs questions concurrently.
#
# LOCAL-ONLY: AppIds pasted below. Before ANY submission, run
# `python tools/scrub_appids.py` to replace with ${LLM_APPID} placeholders.
# NEVER submit AppIds in supplements.

models:
  # ---- AppId groups (5 per model) ----
  _gpt_group: &gpt_group
    - "${LLM_APPID}"   # set via env var

  _qwen_plus_group: &qwen_plus_group
    - "${LLM_APPID}"   # set via env var

  _qwen35_group: &qwen35_group
    - "${LLM_APPID}"   # set via env var

  _kimi_group: &kimi_group
    - "${LLM_APPID}"   # set via env var

  gpt-4.1:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *gpt_group
    model_name: "gpt-4.1"                # GPT mid-tier (2025)
    temperature: 0.6
    max_tokens: 8192

  gpt-4.1-mini:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *gpt_group
    model_name: "gpt-4.1-mini"           # GPT mini-tier (2025), cheaper + faster
    temperature: 0.6
    max_tokens: 8192

  qwen-plus-latest:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *qwen_plus_group
    model_name: "qwen-plus-latest"
    temperature: 0.6
    max_tokens: 8192

  qwen3.5-baidu:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *qwen35_group
    model_name: "qwen3.5-baidu"
    temperature: 0.6
    max_tokens: 8192

  kimi-k3:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *kimi_group
    model_name: "kimi-k3"                # reasoning model (has reasoning_tokens)
    temperature: 1.0                     # kimi-k3 forces temperature=1 (reasoning model)
    max_tokens: 8192

  aws.claude-haiku-4.5:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *qwen35_group               # reuse qwen35 AppId group (one AppId calls all models)
    model_name: "aws.claude-haiku-4.5"
    temperature: 0.6
    max_tokens: 8192

  gemini-2.5-flash:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *gpt_group
    model_name: "gemini-2.5-flash"        # Gemini 2.5 Flash (2025), reasoning model
    temperature: 0.6
    max_tokens: 4096                      # reasoning models need room for thinking

  LongCat-Flash-Chat:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *kimi_group
    model_name: "LongCat-Flash-Chat"
    temperature: 0.6
    max_tokens: 8192

  gpt-4o-mini:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *gpt_group
    model_name: "gpt-4o-mini"
    temperature: 0.6
    max_tokens: 8192

  gemini-2.5-flash-lite:
    provider: openai_compat
    base_url: "${LLM_GATEWAY_URL}"
    api_key: *gpt_group
    model_name: "gemini-2.5-flash-lite"
    temperature: 0.6
    max_tokens: 4096

# Paper → model assignment (kept here for reference; run.py --model picks one):
#   EARA   = {gpt-4.1, qwen-plus-latest, kimi-k3}
#   CASE   = {qwen-plus-latest, qwen3.5-baidu, kimi-k3}
#   FALCON = {gpt-4.1, kimi-k3, qwen3.5-baidu}
# (each paper uses 3 of 4 models; any two papers overlap in 2 models.
#  4 models: gpt-4.1 / qwen-plus-latest / qwen3.5-baidu / kimi-k3.

# Retrieval config
retrieval:
  mode: "bm25_local"     # wikipedia_api | bm25_local | webdetective
  # wikipedia_api: uses MediaWiki API (rate-limited, no setup) -- good for dev
  # bm25_local: builds BM25 over HotpotQA/2Wiki context paragraphs (offline, fast)
  # webdetective: uses the WebDetective sandbox (requires their env + SERPER_API_KEY)
  top_k: 3
  webdetective_repo: "../WebDetective"   # path to cloned WebDetective repo

# Experiment config
experiment:
  benchmarks:
    - hotpotqa
    - 2wikimultihop
    # - webdetective     # enable once sandbox is up
  n_test: 500            # number of test questions per benchmark (cut for cost)
  n_dev: 200             # dev set size for threshold calibration
  max_steps: 40          # retrieval budget T
  selfconsistency_k: 5   # samples for confidence p_t
  seed: 42

# EARA thresholds (will be calibrated on dev set; these are init values)
eara:
  tau_c: 0.6       # coverage threshold (lowered from 0.8 to reduce false abstain)
  tau_delta: 0.3   # max allowed conflict (relaxed from 0.2)
  tau_p: 0.4       # confidence threshold (lowered from 0.6 to reduce false abstain)
  calibrate: false  # manual tuning for now; enable --calibrate for grid search

# CASE config (second paper). tier-selection thresholds + progress weights.
case:
  budget: 24            # total LLM-call budget B per question
  theta: [0.7, 0.4, 0.7, 0.5]   # (theta1, theta2, theta_p, theta_v) for Eq. 2
  alpha: [1.0, 1.0, 1.0, 1.0]   # progress-signal mixing weights
  S: 4                  # deep-tier sample count
  V: 4                  # verify-tier sample count
  calibrate: true

# FALCON config (third paper). falsifiability-testing thresholds + noise injection.
falcon:
  theta_drop: 0.3       # passage survival threshold (drop passages with W < theta_drop)
  K: 2                  # counter-arguments per claim
  calibrate: true
  # Noise injection (FALCON stresses robustness to noisy/conflicting/adversarial passages)
  noise:
    mode: "random"      # random | conflict | adversarial | none
    k: 2                # number of distractor passages injected per retrieval step
    seed: 42

# Output
output:
  results_dir: "./results"
  log_dir: "./logs"
