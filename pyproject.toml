[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "eara"
version = "0.1.0"
description = "Evidence-Aware Retrieval Agents: controlling retrieval and knowing when to abstain"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous", email = "anonymous@example.invalid" }]
keywords = ["retrieval-augmented-generation", "multi-hop-qa", "abstention",
            "evidence-sufficiency", "llm-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "datasets>=2.14",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
eara-run = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "methods*", "prompts*", "evaluation*", "analysis*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
